<div class="bubble bubble-me">{{ m.question }}</div>
<div>
  <div class="bubble bubble-bot">{{ m.answer }}</div>
  {% if m.sources %}<div class="flex flex-wrap gap-1 mt-1.5 ml-1">{% for s in m.sources %}<span class="chip !text-[10px] !py-0.5">📎 {{ t(s.title) }}</span>{% endfor %}</div>{% endif %}
</div>
