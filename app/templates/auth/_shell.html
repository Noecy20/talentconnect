{% extends "base.html" %}
{% from "_macros.html" import langswitch, themetoggle, location with context %}
{% block body %}
<div class="auth-bg min-h-screen relative overflow-hidden flex items-center justify-center px-4 pt-20 pb-10 lg:py-10">
  <!-- Vague brune en haut à gauche -->
  <svg class="absolute -top-10 -left-10 w-[62vw] max-w-[860px] min-w-[420px] pointer-events-none" viewBox="0 0 800 560" aria-hidden="true">
    <path d="M0 0H760C800 70 720 130 640 150C560 170 560 250 600 300C650 360 600 450 500 450C400 450 380 380 300 400C220 420 200 520 110 540C60 550 20 520 0 500Z" fill="#3B1A0E"/>
    <circle cx="140" cy="120" r="9" fill="#F3B48C"/><circle cx="420" cy="70" r="6" fill="#FAF1E3" opacity=".8"/>
    <circle cx="560" cy="210" r="5" fill="#E08B5A"/><circle cx="250" cy="330" r="7" fill="#FAF1E3" opacity=".5"/>
  </svg>
  <div class="absolute top-5 right-5 flex gap-2 z-20">{{ langswitch() }}{{ themetoggle() }}</div>

  <div class="relative z-10 w-full max-w-5xl grid lg:grid-cols-[1fr_1.05fr] rounded-[28px] overflow-hidden shadow-2xl auth-card">
    <!-- Illustration -->
    <div class="hidden lg:block relative overflow-hidden" style="background:var(--surface)">
      <svg viewBox="0 0 520 620" class="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path d="M0 0H520V170C470 210 430 190 390 230C340 280 380 330 320 360C250 395 200 330 130 350C70 368 40 420 0 430Z" fill="#4A2414"/>
        <!-- planète -->
        <g transform="translate(120 120)"><circle r="48" fill="#E8912F"/><circle cx="-14" cy="-10" r="9" fill="#C76E1E" opacity=".7"/><circle cx="16" cy="14" r="6" fill="#C76E1E" opacity=".7"/>
          <ellipse rx="78" ry="18" fill="none" stroke="#F3D2B6" stroke-width="3" transform="rotate(-12)"/></g>
        <circle cx="300" cy="70" r="20" fill="#E9E1D6"/><circle cx="292" cy="64" r="5" fill="#CFC3B4"/>
        <circle cx="430" cy="120" r="7" fill="#E8912F"/><circle cx="250" cy="200" r="5" fill="#E8912F"/><circle cx="70" cy="260" r="6" fill="#FAF1E3" opacity=".6"/>
        <!-- feuilles -->
        <g fill="#EFE7DC"><path d="M90 610C60 520 110 470 150 440C160 500 150 560 90 610Z"/><path d="M170 615C160 540 200 500 245 480C245 540 225 585 170 615Z"/><path d="M60 600C20 560 20 510 40 480C70 520 80 560 60 600Z"/></g>
        <!-- téléphone -->
        <g transform="translate(160 165)">
          <rect width="200" height="380" rx="30" fill="#E8912F"/>
          <rect x="62" y="10" width="76" height="16" rx="8" fill="#4A2414"/>
          <rect x="45" y="70" width="110" height="80" rx="6" fill="none" stroke="#FAF1E3" stroke-width="2"/>
          <circle cx="85" cy="110" r="16" fill="#FAF1E3"/><circle cx="105" cy="110" r="16" fill="#FAF1E3" opacity=".9"/><circle cx="125" cy="110" r="16" fill="#3B1A0E"/>
          <circle cx="36" cy="210" r="5" fill="#3B1A0E"/><rect x="50" y="208" width="120" height="4" rx="2" fill="#FAF1E3"/>
          <circle cx="36" cy="250" r="5" fill="#3B1A0E"/><rect x="50" y="248" width="120" height="4" rx="2" fill="#FAF1E3"/>
          <circle cx="36" cy="290" r="5" fill="#3B1A0E"/><rect x="50" y="288" width="90" height="4" rx="2" fill="#FAF1E3"/>
          <rect x="120" y="326" width="52" height="20" rx="4" fill="#3B1A0E"/>
        </g>
      </svg>
      <div class="absolute left-8 right-8 bottom-8">
        <a href="{{ url_for('main.index') }}" class="inline-flex items-center gap-2 rounded-full bg-[var(--surface)] px-3 py-1.5 shadow">
          <img src="{{ url_for('static', filename='img/logo-mark.png') }}" class="w-6" alt=""><span class="font-display font-bold text-sm"><span style="color:var(--ink-2)">Talent</span><span class="text-terra-600">Connect</span></span></a>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="px-6 sm:px-12 py-10 sm:py-12" style="background:var(--surface)">
      <a href="{{ url_for('main.index') }}" class="lg:hidden inline-flex items-center gap-2 mb-6"><img src="{{ url_for('static', filename='img/logo-mark.png') }}" class="w-8" alt=""><span class="font-display font-bold"><span style="color:var(--ink-2)">Talent</span><span class="text-terra-600">Connect</span></span></a>
      <div class="max-w-md">{% block form %}{% endblock %}</div>
    </div>
  </div>
</div>
{% endblock %}
