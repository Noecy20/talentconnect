{% extends "auth/_shell.html" %}
{% block title %}{{ t('Connexion') }}{% endblock %}
{% block form %}
<h1 class="font-display text-3xl font-bold">{{ t('Bon retour 👋') }}</h1>
<p class="muted mt-2">{{ t('Connectez-vous pour retrouver votre espace.') }}</p>
<form method="post" class="mt-8 space-y-5" x-data="{show:false}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
  <div><label class="label">{{ t('E-mail') }}</label><input name="email" type="email" required autofocus class="input" placeholder="vous@exemple.com"></div>
  <div><label class="label">{{ t('Mot de passe') }}</label>
    <div class="relative"><input name="password" :type="show?'text':'password'" required class="input pr-11">
      <button type="button" @click="show=!show" class="absolute right-3 top-1/2 -translate-y-1/2 muted"><i data-lucide="eye" class="w-4 h-4"></i></button></div></div>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="remember" class="check" checked>{{ t('Rester connecté') }}</label>
  <button class="btn btn-primary btn-lg w-full">{{ t('Se connecter') }}<i data-lucide="arrow-right" class="w-4 h-4"></i></button>
</form>
<p class="text-sm muted mt-8 text-center">{{ t('Pas encore de compte ?') }} <a href="{{ url_for('auth.register', next=request.args.get('next')) }}" class="font-semibold text-terra-600 hover:underline">{{ t('Inscrivez-vous') }}</a></p>
{% endblock %}
